<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário · F1 Campeonato de Pilotos</title>
<meta name="description" content="Calendário completo da temporada de Fórmula 1 — corridas já disputadas e próximas etapas, com data, circuito e contagem regressiva.">
<meta name="theme-color" content="#0A0C0A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0C0A'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-weight='900' font-size='30' fill='%23E2762A' text-anchor='middle'%3EF1%3C/text%3E%3C/svg%3E">

<!-- fontes do Google Fonts e a biblioteca de bandeiras (flag-icons) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Staatliches&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7/css/flag-icons.min.css">

<!-- toda a aparência do site (cores, layout, fontes) mora aqui -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- barra do topo: link de volta + seletor de temporada, montada por js/layout.js -->
<div class="topbar" id="topbar"></div>

<div class="wrap">

  <section class="hero" style="padding-top:56px;">
    <p class="eyebrow" data-i18n="calendar_eyebrow">Calendário completo</p>
    <h1><span data-i18n="calendar_title_l1">Todas as corridas</span><br><span data-i18n="calendar_title_l2">da temporada.</span></h1>
    <p class="sub" id="hero-sub">Carregando calendário…</p>
    <div class="season-rankings" id="season-rankings"></div>
  </section>

  <section id="calendar-list-section">
    <div class="cal-list" id="cal-list"><div class="state-msg" data-i18n="loading_races">Carregando corridas…</div></div>
  </section>

</div>

<footer>
  <div class="wrap">
    <span data-i18n="footer_credit">Dados oficiais da FIA via Jolpica F1 API</span>
  </div>
</footer>

<script type="module" src="js/pages/calendario.js"></script>
</body>
</html>
